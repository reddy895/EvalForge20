name: EvalForge20 CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types, tests, migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check backend/src tests backend/tests
      - name: Python bytecode compilation
        run: python -m compileall -q backend/src
      - name: Pytest suite
        run: pytest -v
      - name: Apply Alembic migrations against a fresh database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration-test.db
        run: |
          cd backend
          alembic upgrade head
          alembic current

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: TypeScript typecheck
        run: cd frontend && npx tsc -b
      - name: Vitest suite
        run: cd frontend && npm test
      - name: Production bundle build
        run: cd frontend && npm run build

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --desc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        run: cd frontend && npm ci && npm audit --audit-level=high
