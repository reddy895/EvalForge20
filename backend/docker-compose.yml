services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: evalforge20-backend:latest
    container_name: evalforge20-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/evalforge.db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ALLOW_PRIVATE_PROVIDER_ENDPOINTS: "true"
    volumes:
      - evalforge_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: evalforge20-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the postgres profile}
      POSTGRES_DB: ${POSTGRES_DB:-evalforge}
    volumes:
      - evalforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evalforge} -d ${POSTGRES_DB:-evalforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  evalforge_data:
  evalforge_pgdata:
